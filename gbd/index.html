<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="only light">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBD do dia · BFU</title>
<meta name="theme-color" content="#10294A">

<style>
:root{color-scheme:only light}
:root{
 --az:#2F6FE4;        /* azul do GBD, o mesmo da placa na tela inicial */
 --mar:#10294A;       /* azul-marinho do cabeçalho e do bloco do GBD */
 --mar2:#0A1E38;
 --bg:#EDF1F7;
 --tx:#11253D;
 --mut:#5A6B80;
 --li:#C9D4E2;
 --ok:#1E8C6B;
 --al:#C2410C;
 --f:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
 --fc:Georgia,Cambria,"Times New Roman",serif;
 --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 var(--f);min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0}
button{font:inherit;color:inherit;cursor:pointer}

/* cabeçalho */
.top{flex:none;display:flex;align-items:center;gap:10px;background:var(--mar);color:#fff;
 border-bottom:3px solid var(--az);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.logo{flex:none;width:38px;height:38px;border-radius:9px;display:grid;place-items:center;
 background:var(--az);color:#fff;font:700 14px/1 var(--f);letter-spacing:.04em}
.top b{font:600 17px/1.15 var(--fc);flex:1;min-width:0;letter-spacing:.01em}
.hubback{flex:none;display:inline-flex;align-items:center;gap:5px;height:38px;padding:0 12px 0 10px;
 border:1.5px solid rgba(255,255,255,.4);border-radius:9px;background:transparent;color:#fff;font:600 15px/1 var(--f)}
.hubback[hidden]{display:none}
.hubback svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.hubback:active{background:rgba(255,255,255,.12)}
body.in-hub .logo{display:none}

main{flex:1;width:100%;max-width:580px;margin:0 auto;padding:18px 14px 20px;display:flex;flex-direction:column;gap:13px}
.hello{margin:2px 2px 0}
.hello h1{font:400 31px/1.1 var(--fc);letter-spacing:-.01em}
.hello .d{margin-top:6px;font-size:13.5px;color:var(--mut)}

/* cartões */
.card{background:#fff;border:1px solid var(--li);border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(16,41,74,.06)}
.ch{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:11px 14px;background:#fff;border-bottom:1px solid var(--li)}
.ch .q{font:600 11px/1 var(--f);text-transform:uppercase;letter-spacing:.1em;color:var(--az)}
.ch .dd{font:400 19px/1.1 var(--fc);color:var(--tx)}
.ch .spacer{flex:1}
.cb{padding:14px}
.cb h3{font:400 20px/1.2 var(--fc)}
.cb p.hint{color:var(--mut);font-size:13.5px;margin:5px 0 12px}

/* o GBD pronto */
pre{margin:0;padding:15px 14px;background:var(--mar);color:#E7EEF8;
 font:13px/1.62 var(--mono);white-space:pre-wrap;word-break:break-word}
.nota{padding:10px 14px;background:#F6F9FD;border-top:1px solid var(--li);font-size:13px;line-height:1.4;color:var(--mut)}
.nota b{color:var(--tx)}

/* botões */
.btn{background:#fff;border:1px solid var(--li);border-radius:8px;padding:7px 12px;font:600 14px/1.1 var(--f);color:var(--tx)}
.btn:hover{border-color:var(--az);color:var(--az)}
.btn.am{background:var(--az);border-color:var(--az);color:#fff}
.btn.am:hover{filter:brightness(1.08);color:#fff}
.btn.claro{background:#fff;border-color:var(--li)}
.btn.sm{padding:5px 10px;font-size:13.5px}
.btn:disabled{opacity:.35;pointer-events:none}
.btn:focus-visible,.hubback:focus-visible,.tcard:focus-visible,.volta:focus-visible{outline:3px solid var(--az);outline-offset:2px}
.nav{display:flex;gap:6px;align-items:center}
.volta{display:inline-flex;align-items:center;gap:6px;background:transparent;border:0;padding:2px 0;
 font:600 14px/1 var(--f);color:var(--az);align-self:flex-start}
.volta:hover{text-decoration:underline}

/* etiquetas */
.tag{font:600 10.5px/1 var(--f);text-transform:uppercase;letter-spacing:.08em;padding:5px 9px;border-radius:6px;
 background:#E8EEF8;color:var(--az)}
.tag.prev{background:#FFF1E4;color:var(--al)}
.tag.conf{background:#E3F4EE;color:var(--ok)}
.tag.fer{background:#EFE8FA;color:#5B3FA8}

/* tabela do rodízio */
table{width:100%;border-collapse:collapse;font-size:14.5px}
td,th{padding:8px;border-bottom:1px solid #E6ECF4;text-align:left}
th{font:600 10.5px/1 var(--f);text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding-bottom:6px}
tr:last-child td{border-bottom:0}
tr.hoje td{background:#EDF3FE;font-weight:600}
tr.futuro td{color:#93A3B5}
td.dia{white-space:nowrap;width:1%;font-variant-numeric:tabular-nums}
td.q{text-align:right;white-space:nowrap;width:1%}
.est{font:600 10px/1 var(--f);text-transform:uppercase;letter-spacing:.06em;padding:5px 8px;border-radius:6px;
 background:#F0F3F8;color:#93A3B5}
.est.feito{background:#E3F4EE;color:var(--ok)}
.est.hoje{background:var(--az);color:#fff}
.faltam{margin-top:12px;padding:10px 12px;border-left:3px solid var(--az);border-radius:0 8px 8px 0;
 background:#F2F6FC;font-size:13.5px;line-height:1.4}
.faltam b{font-weight:600}
.alerta{border-left:3px solid var(--al);border-radius:0 8px 8px 0;padding:11px 13px;background:#FFF6EF;font-size:13.5px;line-height:1.45}
.alerta.erro{background:#FDEEEC;border-color:#C2201C}
textarea{width:100%;height:120px;background:#fff;border:1px solid var(--li);border-radius:8px;padding:9px;
 font:12px var(--mono);color:inherit;margin-top:9px}

footer{flex:none;padding:16px 14px calc(16px + env(safe-area-inset-bottom));text-align:center;
 font-size:11.5px;color:var(--mut);line-height:1.8}
footer .off{display:inline-block;padding:4px 10px;border-radius:999px;background:#E3EAF5;color:#3C5168;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(14px);background:var(--mar);color:#fff;
 padding:11px 18px;border-radius:10px;font:600 14px/1 var(--f);opacity:0;pointer-events:none;transition:.22s;z-index:50}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* escolha de turno */
.turnos{display:flex;flex-direction:column;gap:10px}
.tcard{display:flex;align-items:center;width:100%;padding:0;border:1px solid var(--li);text-align:left;
 color:var(--tx);background:#fff;border-radius:12px;overflow:hidden;min-height:76px;
 box-shadow:0 1px 2px rgba(16,41,74,.06);transition:transform .1s,border-color .12s}
.tcard:active{transform:scale(.99)}
.tcard:hover{border-color:var(--az)}
.tcard .ic{flex:none;margin:0 13px;width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:var(--c)}
.tcard .ic svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.tcard .tx{flex:1;min-width:0;padding:12px 8px 12px 0}
.tcard .tx b{display:block;font:400 22px/1.1 var(--fc)}
.tcard .tx span{display:block;font-size:13.5px;color:var(--mut);margin-top:3px;line-height:1.3}
.tcard .go{flex:none;width:34px;display:grid;place-items:center;color:var(--az)}
.tcard .go::before{content:"";width:9px;height:9px;border-top:2.5px solid currentColor;border-right:2.5px solid currentColor;transform:rotate(45deg);margin-left:-4px}
.tcard.vazio{background:#F7F9FC}
.tcard.vazio .ic{background:#CFD9E6}
.tcard.vazio .tx b{color:var(--mut)}
.tcard.vazio .go{color:#A9B6C7}
.tcard.manha{--c:#E0922A}.tcard.tarde{--c:var(--az)}.tcard.noite{--c:#5B4B9E}

@media(min-width:720px){
 main{max-width:720px;padding-top:26px}
 .hello h1{font-size:38px}
 .ch .dd{font-size:21px}
}
</style>
</head>

const DIA=86400000;
const DOW=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const d2k=d=>d.toISOString().slice(0,10);
const k2d=k=>{const[a,b,c]=k.split('-').map(Number);return new Date(Date.UTC(a,b-1,c))};
const addD=(k,n)=>d2k(new Date(k2d(k).getTime()+n*DIA));
const dow=k=>k2d(k).getUTCDay();
const br=k=>{const[a,b,c]=k.split('-');return `${c}/${b}/${a}`};
const diff=(a,b)=>Math.round((k2d(a)-k2d(b))/DIA);
const hojeK=()=>{const n=new Date();return d2k(new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())))};
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}

 if(dd&&dd.conf)return 1;

let turno=(()=>{ /* a tela inicial do BFU já manda o turno escolhido */
 try{const t=new URLSearchParams(location.search).get('turno');
  return ['manha','tarde','noite'].includes(t)?t:null}catch(e){return null}
})();
let verCiclo=null;            // ciclo que o agente está olhando na tabela do rodízio
let foco=null;                // dia que a página considera "o de hoje"

const HORA_VIRADA=22;
function diaFoco(){
 const h=new Date().getHours(),t=turno||'tarde';
 if(t==='noite')return h<6?addD(hojeK(),-1):hojeK();   /* até as 6h ainda é o turno que começou ontem */
 if(t==='manha')return h>=14?addD(hojeK(),1):hojeK();
 const v=(DADOS.tarde&&DADOS.tarde.horaVirada!=null)?DADOS.tarde.horaVirada:HORA_VIRADA;
 return h>=v?addD(hojeK(),1):hojeK();
}

/* ---------- carregar dados ---------- */
function fonteJson(t){
 const p=new URLSearchParams(location.search).get('dados');
 return (p&&(t||'tarde')==='tarde')?p:ARQ[t||'tarde'];
}
async function carregarTurno(t){
 const antes=ESTADO[t];
 if(!DADOS[t]&&ESTADO[t]!=='nao')ESTADO[t]='carregando';
 try{
  const r=await fetch(fonteJson(t),{cache:'no-store'});
  if(r.status===404){ESTADO[t]='nao';DADOS[t]=t==='tarde'?DADOS[t]:null;}
  else{
   if(!r.ok)throw new Error('HTTP '+r.status);
   const j=await r.json();
   if(!j||!j.dias||!Object.keys(j.dias).length)throw new Error('formato');
   DADOS[t]=j;ESTADO[t]='ok';
  }
 }catch(e){
  if(!DADOS[t])ESTADO[t]=(antes==='ok'||antes==='nao')?antes:'off';   /* sem rede: fica o que se sabia */
 }
 guardaEstado();
 return ESTADO[t];
}
async function carregar(silencioso){
 const ts=turno?[turno]:['tarde','manha','noite'];
 if(turno===null)ts.push(...['manha','noite'].filter(x=>!ts.includes(x)));
 await Promise.all([...new Set(ts)].map(carregarTurno));
 if(!silencioso)toast('Dados atualizados');
 render();
}

/* ---------- render ---------- */
function render(){
 const al=$('#alerta');al.innerHTML='';
 const box=$('#conteudo');box.innerHTML='';

 D=DADOS[turno||'tarde']||null;
 if(turno&&turno!=='tarde'){
  if(ESTADO[turno]==='nao'){montarSemGbd(box,turno);return}
  if(!D){montarAguardando(box,turno);return}
 }
 if(turno===null&&!DADOS.tarde){montarEscolha(box);return}
 if(!D||!D.dias){
  $('#tit').textContent='GBD do dia';
  const a=el('div','alerta erro');
  a.innerHTML=`Nenhum dado carregado. Esta página lê o arquivo <b>gbd-dados.json</b> na mesma pasta.
  O responsável pela escala gera esse arquivo no montador de GBD, no botão <b>Copiar dados da página dos agentes</b>, e salva aqui ao lado.
  <br>Se preferir, cole o conteúdo do arquivo abaixo só para olhar agora.`;
  const ta=el('textarea');ta.placeholder='Cole aqui o conteúdo de gbd-dados.json';
  const b=el('button','btn am sm','Carregar colado');b.style.marginTop='8px';
  b.onclick=()=>{try{const j=JSON.parse(ta.value);if(!j.dias)throw 0;D=j;verDia=null;render();toast('Carregado')}catch(e){toast('JSON inválido')}};
  a.append(ta,b);al.appendChild(a);
  return;
 }

 foco=diaFoco();
 if(!verDia)verDia=foco;
 if(verDia>foco)verDia=foco;   /* a página dos agentes não mostra dia futuro */
 const chaves=Object.keys(D.dias).sort();
 const primeiro=chaves[0],ultimo=chaves[chaves.length-1];
 $('#tit').textContent=`GBD | ${D.estacao||'Estação'}${D.turno?' – '+D.turno:''}`;
 $('#sub').textContent=`O GBD de hoje e os dias anteriores, desde ${br(primeiro)}`;

 if(turno===null){montarEscolha(box);return}

 const bv=el('button','volta','‹ Trocar de turno');
 bv.onclick=voltarEscolha;
 box.appendChild(bv);

 const dd=D.dias[verDia];

 if(!dd){
  const a=el('div','alerta');
  a.innerHTML=verDia>ultimo
   ? `O GBD de <b>${br(verDia)}</b> ainda não foi publicado. O último dia disponível é <b>${br(ultimo)}</b>.`
   : `Não há GBD publicado para <b>${br(verDia)}</b>.`;
  al.appendChild(a);
 } else if(verDia===foco && diff(foco,ultimo)>-3){
  const a=el('div','alerta');
  a.innerHTML=`Os dados publicados terminam em <b>${br(ultimo)}</b>. Vale pedir ao responsável para atualizar.`;
  al.appendChild(a);
 }

 /* cartão do GBD */
 const c=el('div','card');
 const h=el('div','ch');
 const ehFoco=verDia===foco;
 const agora=new Date();
 const rot=ehFoco?(foco>hojeK()?'GBD de amanhã':foco<hojeK()?'Turno em andamento':'GBD de hoje'):'Outro dia';
 h.appendChild(el('span','q',rot));
 h.appendChild(el('span','dd',`${DOW[dow(verDia)]}, ${br(verDia)}`));
 if(dd&&dd.feriado)h.appendChild(el('span','tag fer',dd.feriado));
 const cf=dd?confirmadoEm(verDia,dd):0;
 if(dd)h.appendChild(el('span','tag '+(cf?'conf':'prev'),cf?'confirmado':'previsto'));
 h.appendChild(el('span','spacer'));
 const nav=el('div','nav');
 const bp=el('button','btn claro sm','‹');bp.title='Dia anterior';
 bp.onclick=()=>{verDia=addD(verDia,-1);verCiclo=null;render()};
 const bn=el('button','btn claro sm','›');bn.title=verDia>=foco?'Não há dia seguinte publicado':'Dia seguinte';
 if(verDia>=foco)bn.disabled=true; else bn.onclick=()=>{verDia=addD(verDia,1);verCiclo=null;render()};
 nav.append(bp,bn);
 if(!ehFoco){const bh=el('button','btn claro sm','Hoje');bh.onclick=()=>{verDia=foco;verCiclo=null;render()};nav.appendChild(bh)}
 h.appendChild(nav);
 if(dd){
  const bc=el('button','btn am sm','Copiar');
  bc.onclick=async()=>{
   try{await navigator.clipboard.writeText(dd.txt)}catch(e){
    const ta=document.createElement('textarea');ta.value=dd.txt;ta.style.position='fixed';ta.style.opacity='0';
    document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove();
   }
   toast('GBD copiado');
  };
  h.appendChild(bc);
 }
 c.appendChild(h);
 if(dd)c.appendChild(el('pre',null,dd.txt));
 if(dd){
  const n=el('div','nota');
  n.innerHTML=cf
   ? (cf===1?'<b>Confirmado</b> pelo responsável da escala. É este o GBD do dia.':'<b>Confirmado.</b> É este o GBD do dia.')
   : '<b>Previsto.</b> Ainda pode mudar por folga, ausência ou troca de posto.';
  c.appendChild(n);
 }
 else c.appendChild(el('div','cb',el('p','hint','Sem GBD para esta data.').textContent));
 box.appendChild(c);

 /* ciclo do posto de rodízio até a data */
 if(dd&&dd.ciclo&&D.ciclos&&(D.ciclos[dd.ciclo]||verCiclo))montarCiclo(box,dd);

}

function voltarEscolha(){
 if(typeof IN_FRAME!=='undefined'&&IN_FRAME){goHub();return}
 turno=null;verDia=null;render();
}
const TURNOS=[
 ['manha','Manhã','06h às 14h','<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.2 12H1.6M22.4 12h-2.6M6.5 6.5 4.7 4.7M19.3 19.3l-1.8-1.8M17.5 6.5l1.8-1.8M4.7 19.3l1.8-1.8"/></svg>'],
 ['tarde','Tarde','14h às 22h','<svg viewBox="0 0 24 24"><path d="M3 18h18"/><circle cx="12" cy="11" r="4"/><path d="M12 2.8v2.4M5.2 11H2.8M21.2 11h-2.4M6.9 5.9 5.2 4.2M18.8 4.2l-1.7 1.7"/><path d="M2 21.3h20"/></svg>'],
 ['noite','Noite','22h às 06h','<svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>'],
];
function montarEscolha(box){
 $('#tit').textContent='GBD do dia';
 $('#sub').textContent=`${(DADOS.tarde&&DADOS.tarde.estacao)||'BFU'} · escolha o turno`;
 const g=el('div','turnos');
 const FR={ok:'GBD publicado',nao:'ainda não criado',carregando:'verificando…','?':'verificando…',off:'sem conexão'};
 for(const [id,rot,hora,svg] of TURNOS){
  const st=ESTADO[id]||'?',tem=st==='ok';
  const b=el('button','tcard '+id+(tem?'':' vazio'));b.type='button';
  b.innerHTML=`<div class="ic">${svg}</div><div class="tx"><b>${rot}</b><span>${hora} · ${FR[st]||''}</span></div><div class="go"></div>`;
  b.onclick=()=>{turno=id;verDia=null;verCiclo=null;render();if(id!=='tarde'&&!DADOS[id])carregarTurno(id).then(render)};
  g.appendChild(b);
 }
 box.appendChild(g);
}
function montarAguardando(box,id){
 const t=TURNOS.find(x=>x[0]===id),rot=t?t[1]:'turno';
 $('#tit').textContent='GBD da '+rot.toLowerCase();
 const off=ESTADO[id]==='off';
 $('#sub').textContent=off?'Sem conexão':'Carregando…';
 const c=el('div','card'),cb=el('div','cb');
 cb.appendChild(el('h3',null,off?'Sem internet agora':'Buscando o GBD da '+rot.toLowerCase()+'…'));
 if(off)cb.appendChild(el('p','hint','Este aparelho ainda não guardou o GBD deste turno. Abra uma vez com internet e ele passa a abrir sem sinal também.'));
 const b=el('button','btn am sm','‹ Voltar');b.style.marginTop='11px';b.onclick=voltarEscolha;cb.appendChild(b);
 c.appendChild(cb);box.appendChild(c);
}
function montarSemGbd(box,id){
 const t=TURNOS.find(x=>x[0]===id);
 const rot=t?t[1]:'turno';
 $('#tit').textContent='GBD da '+rot.toLowerCase();
 $('#sub').textContent='Ainda não criado';
 const c=el('div','card');
 const h=el('div','ch');
 h.appendChild(el('span','q',rot));
 h.appendChild(el('span','dd','Ainda não criado'));
 c.appendChild(h);
 const cb=el('div','cb');
 cb.appendChild(el('h3',null,'O GBD da '+rot.toLowerCase()+' ainda não existe'));
 const p1=el('p','hint');
 p1.innerHTML=`O GBD da ${rot.toLowerCase()} ainda não foi publicado no app. Para ele aparecer nesta tela, alguém do turno precisa montar o GBD na ferramenta de montagem.`;
 cb.appendChild(p1);
 const f=el('div','faltam');
 f.innerHTML=`<b>Como funciona a ferramenta.</b> Cadastram-se os agentes, a escala de cada um e os postos por ordem de prioridade. A partir disso ela monta o ciclo inteiro: rodízio do posto principal, café e janta com a cobertura mínima, folgas e ausências, e gera o texto pronto para o WhatsApp e o arquivo que alimenta esta página.
 <br><br><b>É líder da ${rot.toLowerCase()}?</b> Procure o AAS Gerson, do turno da tarde, para receber a ferramenta e publicar o GBD da ${rot.toLowerCase()} aqui no app.`;
 cb.appendChild(f);
 const b=el('button','btn am sm','‹ Voltar');b.style.marginTop='11px';
 b.onclick=voltarEscolha;
 cb.appendChild(b);
 c.appendChild(cb);box.appendChild(c);
}
function montarCiclo(box,dd){
 const chaves=Object.keys(D.ciclos||{}).sort();
 const atual=dd.ciclo;
 if(!verCiclo||!D.ciclos[verCiclo])verCiclo=atual;
 const i=chaves.indexOf(verCiclo);
 const ci=D.ciclos[verCiclo];
 if(!ci)return;
 const rotulo=D.rodizio&&D.rodizio.rotulo?D.rodizio.rotulo:'SSO';
 const c=el('div','card');
 const h=el('div','ch');
 h.appendChild(el('span','q','Rodízio da '+rotulo));
 h.appendChild(el('span','dd',`Ciclo de ${br(ci.ini)} a ${br(ci.fim)}`));
 if(verCiclo===atual)h.appendChild(el('span','tag','ciclo de hoje'));
 h.appendChild(el('span','spacer'));
 const nav=el('div','nav');
 const bp=el('button','btn claro sm','‹');bp.title='Ciclo anterior';
 if(i<=0)bp.disabled=true; else bp.onclick=()=>{verCiclo=chaves[i-1];render()};
 const bn=el('button','btn claro sm','›');bn.title='Ciclo seguinte';
 if(verCiclo>=atual||i<0||i>=chaves.length-1)bn.disabled=true; else bn.onclick=()=>{verCiclo=chaves[i+1];render()};
 nav.append(bp,bn);
 if(verCiclo!==atual){const ba=el('button','btn claro sm','Atual');ba.onclick=()=>{verCiclo=null;render()};nav.appendChild(ba)}
 h.appendChild(nav);
 c.appendChild(h);
 const cb=el('div','cb');
 cb.appendChild(el('p','hint',verCiclo===atual
  ? `Quem passa pela ${rotulo} em cada dia deste ciclo. Os dias à frente são previsão e ainda podem mudar.`
  : `Quem passou pela ${rotulo} em cada dia deste ciclo.`));
 const t=el('table');
 const th=el('thead');th.innerHTML=`<tr><th>Dia</th><th>${esc(rotulo)}</th><th></th></tr>`;
 t.appendChild(th);
 const tb=el('tbody');
 let dias=Object.keys(ci.rod||{}).sort();
 if(!dias.length){dias=[];for(let k=ci.ini;k<=ci.fim;k=addD(k,1))dias.push(k)}
 const passaram=new Set();
 for(const k of dias){if(k>foco)continue;const q=(ci.rod||{})[k];if(q)passaram.add(q)}
 for(const k of dias){
  const futuro=k>foco;
  const r=el('tr',futuro?'futuro':(k===verDia?'hoje':''));
  const td1=el('td','dia',`${DOW[dow(k)].slice(0,3)} ${k.slice(8)}/${k.slice(5,7)}`);
  const q=(ci.rod||{})[k];
  const td2=el('td',null,q||'—');
  const td3=el('td','q');
  td3.appendChild(el('span','est '+(futuro?'':(k===verDia?'hoje':'feito')),futuro?'previsto':(k===verDia?'hoje':'cumprido')));
  r.append(td1,td2,td3);tb.appendChild(r);
 }
 t.appendChild(tb);cb.appendChild(t);
 const todos=(D.equipe||[]).slice();
 if(todos.length){
  const faltam=todos.filter(n=>!passaram.has(n));
  const fd=el('div','faltam');
  fd.innerHTML=faltam.length
   ? `Ainda não passaram pela ${esc(rotulo)} neste ciclo: <b>${faltam.map(esc).join(', ')}</b>.`
   : `Todos já passaram pela ${esc(rotulo)} neste ciclo.`;
  cb.appendChild(fd);
 }
 c.appendChild(cb);box.appendChild(c);
}

/* ---------- volta ao BFU, no mesmo padrão da Ronda e do Reporte SSO ---------- */
const IN_HUB=/\/gbd\/(index\.html)?$/.test(location.pathname);
const IN_FRAME=(()=>{try{return window.parent!==window&&parent.location.origin===location.origin;}catch(_){return false;}})();
function goHub(){if(IN_FRAME){parent.postMessage({bfu:'home'},location.origin);}else location.href='../index.html';}
if(IN_HUB||IN_FRAME){document.body.classList.add('in-hub');const hb=$('#hubBack');hb.hidden=false;hb.onclick=goHub;}

/* ---------- ciclo de vida ---------- */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{});}
render();
carregar(true);   /* busca o turno aberto, ou todos quando está na escolha */
setInterval(()=>{
 const f=diaFoco();
 if(f!==foco){const seguia=(verDia===foco);verDia=seguia?f:verDia;render()}
},30000);
setInterval(()=>carregar(true),300000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)carregar(true)});
</script>
</body>
