<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Simulador de Sinótico · BFU</title>
<link rel="icon" href="../../icon-192.png">
<style>
html,body{margin:0;height:100%;background:#2D2F32;color:#ddd;font:14px/1.3 system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:rgba(30,30,32,.94);border-top:2px solid #FFC61A;z-index:2}
.bar[hidden]{display:none}
.bar b{color:#FFC61A;margin-right:6px}
.bar input[type=text]{width:110px;font:700 15px ui-monospace,Consolas,monospace;text-transform:uppercase;padding:6px 8px;border-radius:6px;border:1px solid #666;background:#111;color:#fff}
.bar select,.bar button{font:600 14px system-ui,sans-serif;padding:6px 10px;border-radius:6px;border:1px solid #666;background:#222;color:#eee;cursor:pointer}
.bar button.y{background:#FFC61A;color:#141414;border-color:#FFC61A}
.bar label{display:flex;align-items:center;gap:6px}
.bar .dica{color:#999;font-size:12px;margin-left:auto}
#mostrar{position:fixed;right:10px;bottom:10px;z-index:2;opacity:.35;font:600 12px system-ui;padding:4px 8px;border-radius:6px;border:1px solid #555;background:#222;color:#ccc;cursor:pointer}
#mostrar[hidden]{display:none}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="bar" id="bar">
  <b>Simulador</b>
  <form id="fNovo" style="display:flex;gap:6px;align-items:center">
    <input type="text" id="iPref" placeholder="S120X288" maxlength="10">
    <select id="sVia"></select>
    <button class="y">Pôr trem</button>
  </form>
  <label>Velocidade <input type="range" id="rVel" min="1" max="10" value="4"></label>
  <label><input type="checkbox" id="cAuto" checked> Trens automáticos</label>
  <button id="bPausa" type="button">Pausar</button>
  <button id="bOcultar" type="button">Ocultar barra (H)</button>
  <span class="dica">Prefixo vazio = aleatório. Trem novo entra pela ponta da via.</span>
</div>
<button id="mostrar" hidden>Mostrar barra (H)</button>
<script>
'use strict';
/* Sinótico fictício para testar o ALERTA TREM. Não representa nenhuma linha real. */
const W=1600,H=900,cv=document.getElementById('cv'),cx=cv.getContext('2d');
const NSEC=16,X0=70,X1=1530,SW=(X1-X0)/NSEC,GAP=5;
const COR={fundo:'#2D2F32',livre:'#CFD3C9',trem:'#FF1E1E',liberado:'#22E02A',liberando:'#FFD21A',texto:'#F2F2F2',cinza:'#9A9EA3',plat:'#A9CDF2',platTx:'#16365F',azul:'#2563FF'};
const ESTACOES=[{nome:'LAPA',cod:'LAP',sec:2},{nome:'ÁGUA BRANCA',cod:'ABR',sec:5},{nome:'BARRA FUNDA',cod:'BFU',sec:8},{nome:'LUZ',cod:'LUZ',sec:11},{nome:'BRÁS',cod:'BAS',sec:14}];
const VIAS=[
  {nome:'Via 1 →',y:180,dir:1,plat:1},
  {nome:'Via 2 ←',y:320,dir:-1,plat:2},
  {nome:'Via 3 →',y:580,dir:1,plat:3},
  {nome:'Via 4 ←',y:720,dir:-1,plat:4},
];
// aparelhos de mudança de via (só desenho): entre a via a e a via b, na seção s
const AMVS=[{a:0,b:1,s:4},{a:0,b:1,s:12},{a:2,b:3,s:7}];
const LETRAS='SNKMAPTRL';
let trens=[],pausado=false,tickN=0,velocidade=4,timer=null;

function prefixoAleatorio(){
  const L=()=>LETRAS[Math.floor(Math.random()*LETRAS.length)],n=k=>String(Math.floor(Math.random()*10**k)).padStart(k,'0');
  return L()+n(2+Math.round(Math.random()))+L()+n(3);
}
function ocupado(v,s){return trens.some(t=>t.via===v&&(t.pos===s||t.pos-VIAS[v].dir===s))}
function entrada(v){return VIAS[v].dir>0?0:NSEC-1}
function porTrem(v,id){
  const s=entrada(v);
  if(ocupado(v,s)||ocupado(v,s+VIAS[v].dir))return false;
  trens.push({id:id||prefixoAleatorio(),via:v,pos:s,espera:0});return true;
}
const estacaoEm=s=>ESTACOES.find(e=>e.sec===s);

function tick(){
  if(pausado)return;tickN++;
  for(const t of [...trens]){
    if(t.espera>0){t.espera--;continue}
    const d=VIAS[t.via].dir,prox=t.pos+d;
    if(prox<0||prox>=NSEC){
      if(t.pos-d<0||t.pos-d>=NSEC||t.saindo){trens.splice(trens.indexOf(t),1);continue}
      t.saindo=true;t.pos=prox;continue;
    }
    if(trens.some(o=>o!==t&&o.via===t.via&&(o.pos===prox||o.pos-VIAS[o.via].dir===prox||o.pos===prox+d)))continue;
    t.pos=prox;
    if(estacaoEm(prox))t.espera=3+Math.floor(Math.random()*3);
  }
  if(document.getElementById('cAuto').checked&&tickN%3===0){
    const v=Math.floor(Math.random()*VIAS.length);
    if(trens.filter(t=>t.via===v).length<3&&Math.random()<.45)porTrem(v);
  }
  desenhar();
}

// estado de cada seção: trem (vermelho), caminho liberado (verde) ou em liberação (amarelo)
function estados(){
  const st={};
  for(const t of trens){
    const d=VIAS[t.via].dir,parado=t.espera>1;
    // parado na plataforma: o caminho à frente ainda está sendo liberado
    const verdes=parado?0:2;
    for(let k=1;k<=verdes;k++)st[t.via+':'+(t.pos+d*k)]??='liberado';
    st[t.via+':'+(t.pos+d*(verdes+1))]??='liberando';
  }
  for(const t of trens){st[t.via+':'+t.pos]='trem';st[t.via+':'+(t.pos-VIAS[t.via].dir)]='trem'}
  return st;
}
const mono=(px,w)=>(w||700)+' '+px+'px ui-monospace,Consolas,"Courier New",monospace';
function texto(t,x,y,cor,fonte,al){cx.font=fonte;cx.fillStyle=cor;cx.textAlign=al||'left';cx.fillText(t,x,y);cx.textAlign='left'}

function desenhar(){
  const r=Math.min(innerWidth/W,innerHeight/H),dpr=devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;
  cx.setTransform(r*dpr,0,0,r*dpr,(innerWidth-W*r)/2*dpr,(innerHeight-H*r)/2*dpr);
  cx.fillStyle=COR.fundo;cx.fillRect(-2000,-2000,W+4000,H+4000);
  cx.textBaseline='alphabetic';
  texto('SINÓTICO DE TESTE · LINHA FICTÍCIA',X0,52,COR.cinza,mono(18,600));
  texto(new Date().toLocaleTimeString('pt-BR'),X1,52,COR.cinza,mono(18,600),'right');
  // legenda
  [['trem','Trem'],['liberado','Caminho liberado'],['liberando','Em liberação']].forEach(([k,n],i)=>{
    const x=X0+470+i*230;cx.fillStyle=COR[k];cx.fillRect(x,40,44,8);texto(n,x+54,50,COR.cinza,'600 15px system-ui,sans-serif');
  });
  const st=estados();
  // AMVs: o "X" entre duas vias
  cx.strokeStyle=COR.livre;cx.lineWidth=7;cx.lineCap='butt';
  for(const a of AMVS){
    const x=X0+a.s*SW+GAP,x2=X0+(a.s+1)*SW-GAP,ya=VIAS[a.a].y,yb=VIAS[a.b].y;
    cx.beginPath();cx.moveTo(x,ya);cx.lineTo(x2,yb);cx.moveTo(x,yb);cx.lineTo(x2,ya);cx.stroke();
    texto(String(20+a.s*2+1),x+SW/2-34,(ya+yb)/2+5,COR.texto,mono(15,600));
    texto(String(20+a.s*2+3),x+SW/2+14,(ya+yb)/2+5,COR.texto,mono(15,600));
  }
  // caixas das estações entre os pares de vias
  for(const e of ESTACOES){
    const x=X0+e.sec*SW+SW/2;
    const yc=(VIAS[1].y+VIAS[2].y)/2;
    cx.lineWidth=4;cx.strokeStyle=COR.azul;cx.fillStyle='#1B1D20';
    cx.fillRect(x-36,yc-20,72,40);cx.strokeRect(x-36,yc-20,72,40);
    texto(e.cod,x,yc+9,COR.texto,mono(25,700),'center');
    // etiqueta auxiliar, como "BAS2 C"
    cx.lineWidth=2;cx.strokeStyle='#E6E6E6';cx.strokeRect(x-36,yc+34,62,26);
    texto(e.cod+'2',x-5,yc+54,COR.texto,mono(17,700),'center');
    cx.fillStyle=COR.azul;cx.fillRect(x+28,yc+34,24,26);texto('C',x+40,yc+54,COR.texto,mono(17,700),'center');
    texto(e.nome,x,yc-30,COR.cinza,'600 13px system-ui,sans-serif','center');
  }
  for(let v=0;v<VIAS.length;v++){
    const via=VIAS[v],y=via.y;
    texto(via.nome,X0-62,y-26,COR.cinza,'600 14px system-ui,sans-serif');
    // pontas da via
    cx.fillStyle=COR.livre;cx.fillRect(X0-34,y-4,34-GAP/2,8);cx.fillRect(X1+GAP/2,y-4,34,8);
    for(let s=0;s<NSEC;s++){
      const x=X0+s*SW,e=st[v+':'+s];
      cx.fillStyle=e?COR[e]:COR.livre;
      cx.fillRect(x+GAP/2,y-4,SW-GAP,8);
      // sinal a cada duas seções, na entrada da seção no sentido da via
      if(s%2===0){
        const sx=via.dir>0?x+GAP/2+4:x+SW-GAP/2-4,sy=y-18,fr=st[v+':'+s]==='trem';
        cx.fillStyle=COR.cinza;cx.fillRect(sx-1,sy-7,2,14);
        const cxp=sx+(via.dir>0?-9:9);
        cx.fillRect(Math.min(sx,cxp),sy-1,9,2);
        cx.fillStyle=fr?'#E46A8A':'#2BD94A';cx.beginPath();cx.arc(cxp,sy,5,0,7);cx.fill();
        texto(String(30+v*20+s),sx,sy-12,COR.texto,mono(14,600),'center');
        // seta verde de sentido
        const ax=x+SW/2,ay=y+12;
        cx.fillStyle='#2BD94A';cx.beginPath();
        if(via.dir>0){cx.moveTo(ax-5,ay-4);cx.lineTo(ax+4,ay);cx.lineTo(ax-5,ay+4)}else{cx.moveTo(ax+5,ay-4);cx.lineTo(ax-4,ay);cx.lineTo(ax+5,ay+4)}
        cx.fill();
      }
      // plataforma: bloco azul-claro com o número das vias
      if(estacaoEm(s)){
        const bx=x+SW/2-13,by=y-52;
        cx.fillStyle=COR.plat;cx.fillRect(bx,by,26,36);
        cx.fillStyle=COR.platTx;cx.fillRect(bx+5,by+17,16,1.5);
        texto(String(via.plat*2-1),bx+13,by+14,COR.platTx,mono(12,700),'center');
        texto(String(via.plat*2),bx+13,by+31,COR.platTx,mono(12,700),'center');
      }
    }
  }
  // prefixos em branco, colados na seção da frente do trem
  for(const t of trens){
    if(t.pos<0||t.pos>=NSEC)continue;
    const via=VIAS[t.via],x=X0+t.pos*SW+SW/2,y=via.y+31;
    cx.font=mono(19,700);const w=cx.measureText(t.id).width;
    cx.fillStyle=COR.fundo;cx.fillRect(x-w/2-4,y-17,w+8,22);
    texto(t.id,x,y,COR.texto,mono(19,700),'center');
  }
}

function reiniciarTimer(){clearInterval(timer);timer=setInterval(tick,Math.round(4200/velocidade))}
const sVia=document.getElementById('sVia');
VIAS.forEach((v,i)=>sVia.add(new Option(v.nome,i)));
document.getElementById('fNovo').onsubmit=e=>{
  e.preventDefault();
  const id=document.getElementById('iPref').value.toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!porTrem(+sVia.value,id))alert('A entrada dessa via está ocupada. Tente de novo em alguns segundos.');
  else document.getElementById('iPref').value='';
  desenhar();
};
document.getElementById('rVel').oninput=e=>{velocidade=+e.target.value;reiniciarTimer()};
document.getElementById('bPausa').onclick=e=>{pausado=!pausado;e.target.textContent=pausado?'Continuar':'Pausar'};
function alternarBarra(){const b=document.getElementById('bar');b.hidden=!b.hidden;document.getElementById('mostrar').hidden=!b.hidden}
document.getElementById('bOcultar').onclick=alternarBarra;document.getElementById('mostrar').onclick=alternarBarra;
addEventListener('keydown',e=>{if((e.key==='h'||e.key==='H')&&e.target.tagName!=='INPUT')alternarBarra()});
addEventListener('resize',desenhar);
// começa com alguns trens espalhados
for(let v=0;v<VIAS.length;v++){const d=VIAS[v].dir;[3,9].forEach(k=>{const s=d>0?k:NSEC-1-k;trens.push({id:prefixoAleatorio(),via:v,pos:s,espera:0})})}
desenhar();reiniciarTimer();
</script>
</body>
</html>
